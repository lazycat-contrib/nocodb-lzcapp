application:
  subdomain: nocodb
  multi_instance: false
  # NocoDB has its own accounts, workspaces and role assignments, so it is
  # exposed directly rather than behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://nocodb:8080/

services:
  nocodb:
    # upstream: nocodb/nocodb:2026.10.1
    image: docker.1ms.run/nocodb/nocodb:2026.10.1
    environment:
      # Seeding the admin from the environment matters here: without it NocoDB
      # hands super-admin to whoever signs up first, and this instance is
      # reachable straight from the internet.
      - NC_ADMIN_EMAIL={{ .U.admin_email }}
      - |-
        NC_ADMIN_PASSWORD={{ .U.admin_password }}
      # Base URL used for generated links and invite mail.
      - |-
        NC_PUBLIC_URL=https://{{ .S.AppDomain }}
      - NC_DISABLE_TELE=true
      - TZ=Asia/Shanghai
    binds:
      # SQLite metadata database plus uploaded attachments
      - /lzcapp/var/data:/usr/app/data

usage: |
  NocoDB 是「数据库 + 表格」的混合体。它能把 PostgreSQL、MySQL 里已有的库直接变成一个像 Excel 的界面，也能自己建库，用表格视图、表单视图、看板、画廊来录和管数据，还能自动生成 REST API。

  使用方法：
  1. 打开应用，用安装时填的管理员邮箱和密码登录（密码在安装参数里，默认随机）。
  2. 新建 Base（相当于一个数据库），在表里加字段、填数据。
  3. 切换视图：表格、表单、看板、日历都能从同一份数据生成。
  4. 需要给外部用时，用表单视图收集数据，或者拿自动生成的 API 接进自己的程序。

  数据与安全：
  - 元数据库和附件都在 /lzcapp/var/data，卸载会一并删除，请定期备份。
  - 管理员账号由 **NC_ADMIN_EMAIL / NC_ADMIN_PASSWORD 在首次启动时直接创建**，
    没有内置弱口令。这一步是必须的：不设它 NocoDB 会把超级管理员交给第一个注册的人，
    而这个应用是直接对外的。
  - 应用直接对外开放，由 NocoDB 自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。

  说明：
  - 单容器 + 内置 SQLite，不需要额外数据库。数据量大或多人并发时建议自行换 PostgreSQL。
  - 许可为 Sustainable Use License 1.0：允许免费非商业分发，因此能在商店里提供。
  - 未做真机验证：管理员登录、建表录入、生成 API 以及重启后数据留存
    均未在设备上实测。
